name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: bash build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: chunk-keeper
          path: build/chunk-keeper-*.jar
