name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  jar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: bash build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: upkeep-jar
          path: build/upkeep-*.jar

  windows-app:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - run: ./build.ps1 -Package
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: upkeep-windows
          path: build/Upkeep-*-windows-x64.zip
